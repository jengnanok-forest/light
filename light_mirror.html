<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>光的反射小教室：鏡子與湖面倒影</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <!-- Font Awesome 圖示 -->
  <!-- Google 字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@600;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 順向流動光束動畫 */
    @keyframes dashFlow {
      from { stroke-dashoffset: 40; }
      to { stroke-dashoffset: 0; }
    }
    .ray-animated {
      stroke-dasharray: 12 8;
      animation: dashFlow 0.8s linear infinite;
    }

    /* 燈泡微光脈動效果 */
    @keyframes bulbPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    .bulb-glow {
      transform-origin: 180px 70px;
      animation: bulbPulse 1.8s ease-in-out infinite;
    }

    /* 懸浮按鈕動態 */
    .btn-step {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-step:hover {
      transform: translateY(-3px) scale(1.03);
    }
    .btn-step:active {
      transform: translateY(1px) scale(0.97);
    }
  </style>
</head>

<body class="bg-amber-50 min-h-screen flex flex-col justify-between text-slate-800 p-3 sm:p-6">

  <div class="w-full max-w-5xl mx-auto flex flex-col gap-4">

    <!-- 頂部標題與開關燈區 -->
    <header class="bg-white border-4 border-amber-300 rounded-3xl p-4 shadow-md flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-amber-400 text-amber-950 flex items-center justify-center text-2xl font-black shadow-inner shrink-0">
          🪞
        </div>
        <div>
          <h1 class="text-2xl sm:text-3xl font-black text-amber-950 tracking-wide">
            照鏡子看到自己
          </h1>
          <p class="text-sm font-bold text-amber-700">光的走向三步驟・一眼就看懂！</p>
        </div>
      </div>

      <!-- 一鍵開關燈主按鈕 -->
      <button id="btn-power" onclick="toggleLight()" class="btn-step px-6 py-3 rounded-2xl bg-amber-400 hover:bg-amber-500 text-slate-900 font-black text-lg border-2 border-amber-500 shadow-md flex items-center gap-2 cursor-pointer shrink-0">
        <i id="icon-power" class="fa-solid fa-lightbulb text-yellow-100 text-xl"></i>
        <span id="text-power">💡 燈開啟中 (點擊關燈)</span>
      </button>
    </header>

    <!-- 步驟切換列 (分步體驗按鈕) -->
    <div id="step-bar" class="bg-white border-4 border-amber-200 rounded-2xl p-2 shadow-sm flex flex-wrap items-center justify-center gap-2 sm:gap-3">
      <button id="btn-step-all" onclick="setStep('ALL')" class="btn-step px-4 py-2.5 rounded-xl bg-amber-500 text-white font-black text-base shadow flex items-center gap-1.5 border-2 border-amber-600">
        <span>🌈 全部完整流程</span>
      </button>
      <button id="btn-step-1" onclick="setStep(1)" class="btn-step px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-bold text-base hover:bg-yellow-100 flex items-center gap-1.5 border-2 border-slate-200">
        <span class="w-6 h-6 rounded-full bg-yellow-400 text-amber-950 flex items-center justify-center text-xs font-black">1</span>
        <span>① 燈泡照到人 (黃光)</span>
      </button>
      <button id="btn-step-2" onclick="setStep(2)" class="btn-step px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-bold text-base hover:bg-pink-100 flex items-center gap-1.5 border-2 border-slate-200">
        <span class="w-6 h-6 rounded-full bg-pink-500 text-white flex items-center justify-center text-xs font-black">2</span>
        <span>② 彈光到鏡子 (粉光)</span>
      </button>
      <button id="btn-step-3" onclick="setStep(3)" class="btn-step px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-bold text-base hover:bg-blue-100 flex items-center gap-1.5 border-2 border-slate-200">
        <span class="w-6 h-6 rounded-full bg-blue-500 text-white flex items-center justify-center text-xs font-black">3</span>
        <span>③ 反射進眼睛 (藍光)</span>
      </button>
    <button id="btn-play" onclick="playJourney()" class="btn-step px-4 py-2.5 rounded-xl bg-emerald-500 text-white font-black text-base shadow flex items-center gap-1.5 border-2 border-emerald-600 cursor-pointer"><span>▶ 光的小旅行</span></button>
    </div>

    <!-- 主展示舞台 (SVG 畫布) -->

      <svg id="svg-stage" viewBox="0 0 1000 500" class="w-full h-auto select-none">
        <defs>

            <path d="M 0 1.5 L 9 5 L 0 8.5 Z" fill="#eab308" />
          </marker>

            <path d="M 0 1.5 L 9 5 L 0 8.5 Z" fill="#ec4899" />
          </marker>

            <stop offset="40%" stop-color="#e0f2fe" stop-opacity="0.95" />

            <stop offset="60%" stop-color="#fde047" stop-opacity="0.5" />
            <stop offset="100%" stop-color="#eab308" stop-opacity="0" />

          <!-- 底座 -->

        </g>

        <!-- 3. 光線繪製圖層 (由 JS 動態動態繪製) -->

          <!-- 脖子與頭部 -->
          <rect x="232" y="185" width="16" height="20" fill="#ffedd5" />

          <!-- 帽子/頭髮 -->
          <path d="M 204 145 C 200 100, 280 100, 276 145 Z" fill="#eab308" />
          <rect x="195" y="138" width="85" height="10" rx="5" fill="#ca8a04" />

          <!-- 眼睛 (看向鏡子) -->
          <circle cx="254" cy="148" r="7.5" fill="#ffffff" stroke="#334155" stroke-width="2" />
          <circle cx="256" cy="148" r="3.5" fill="#0f172a" />
          <circle cx="257.5" cy="146" r="1.2" fill="#ffffff" />

          <!-- 微笑嘴巴 -->
          <path d="M 250 165 Q 258 173 264 164" stroke="#ea580c" stroke-width="3" stroke-linecap="round" fill="none" />

          <!-- 實物文字標籤 -->
          <text x="240" y="455" text-anchor="middle" fill="#0369a1" font-size="18" font-weight="900">👦 你自己 (實物)</text>
        </g>

        <!-- 5. 虛像：鏡子裡的自己 (右側 X=770，關燈時隱形) -->

          <!-- 鞋子 -->
          <ellipse cx="755" cy="415" rx="14" ry="7" fill="#16a34a" />
          <ellipse cx="785" cy="415" rx="14" ry="7" fill="#15803d" />

          <!-- 腿 -->
          <rect x="750" y="350" width="10" height="65" rx="4" fill="#ffedd5" />
          <rect x="780" y="350" width="10" height="65" rx="4" fill="#ffedd5" />
          <!-- 褲子 -->
          <path d="M 742 310 L 798 310 L 795 355 L 776 355 L 770 325 L 764 355 L 745 355 Z" fill="#2563eb" />

          <!-- 身體衣服 -->
          <rect x="740" y="200" width="60" height="115" rx="16" fill="#f97316" />
          <path d="M 740 220 L 720 260" stroke="#f97316" stroke-width="12" stroke-linecap="round" />
          <path d="M 800 220 L 820 270" stroke="#f97316" stroke-width="12" stroke-linecap="round" />
          <!-- 手掌 -->
          <circle cx="718" cy="265" r="7" fill="#ffedd5" />
          <circle cx="822" cy="275" r="7" fill="#ffedd5" />

          <!-- 脖子與頭部 -->
          <rect x="762" y="185" width="16" height="20" fill="#ffedd5" />
          <circle cx="770" cy="150" r="38" fill="#ffedd5" />

          <!-- 帽子/頭髮 -->
          <path d="M 734 145 C 730 100, 810 100, 806 145 Z" fill="#eab308" />
          <rect x="730" y="138" width="85" height="10" rx="5" fill="#ca8a04" />

          <!-- 眼睛 (朝左看向鏡子) -->
          <circle cx="756" cy="148" r="7.5" fill="#ffffff" stroke="#334155" stroke-width="2" />
          <circle cx="754" cy="148" r="3.5" fill="#0f172a" />
          <circle cx="752.5" cy="146" r="1.2" fill="#ffffff" />

          <!-- 微笑嘴巴 -->
          <path d="M 746 164 Q 752 173 760 165" stroke="#ea580c" stroke-width="3" stroke-linecap="round" fill="none" />

          <!-- 鏡中像標籤 -->
          <text x="770" y="455" text-anchor="middle" fill="#7e22ce" font-size="18" font-weight="900">✨ 鏡子裡的像</text>
        </g>

        <!-- 黑暗提示文字 (關燈時呈現) -->
        <g id="group-dark-text" class="transition-opacity duration-500" opacity="0">
          <rect x="660" y="200" width="220" height="60" rx="16" fill="#0f172a" opacity="0.85" />
          <text x="770" y="236" text-anchor="middle" fill="#fca5a5" font-size="18" font-weight="900">🙈 一片漆黑！完全看不見</text>
        </g>
      </svg>

    </div>

    <!-- 底部大字說明卡片 -->
    <div id="card-explanation" class="bg-amber-400 border-4 border-amber-500 rounded-3xl p-5 shadow-xl transition-all duration-300">
      <div class="bg-white/95 rounded-2xl p-2 mb-3 text-slate-800">
        <p class="text-center text-xs sm:text-sm font-bold text-slate-500 mb-1">看見東西的秘密：光一定要進到眼睛裡</p>
        <div id="flow-strip" class="flex items-center justify-center gap-1 sm:gap-3 text-sm sm:text-lg font-black">
          <span class="flow-node transition-all duration-300 bg-yellow-200 px-3 py-1.5 rounded-xl">💡 燈光</span><span>➔</span>
          <span class="flow-node transition-all duration-300 bg-orange-200 px-3 py-1.5 rounded-xl">👦 你</span><span>➔</span>
          <span class="flow-node transition-all duration-300 bg-sky-200 px-3 py-1.5 rounded-xl">🪞 鏡子</span><span>➔</span>
          <span class="flow-node transition-all duration-300 bg-blue-200 px-3 py-1.5 rounded-xl">👁️ 眼睛</span>
        </div>
      </div>
      <div class="flex items-center gap-3 mb-2">
        <div id="exp-badge" class="w-10 h-10 rounded-2xl bg-white text-amber-800 flex items-center justify-center text-xl font-black shadow-sm">
          💡
        </div>
        <h2 id="exp-title" class="text-xl sm:text-2xl font-black text-amber-950">
          完整光線走法（三步驟一次看）
        </h2>
      </div>
      <p id="exp-body" class="text-lg sm:text-xl font-black text-slate-900 leading-relaxed">
        ① 燈泡黃光照到人 ➔ ② 人把粉光彈向鏡子 ➔ ③ 鏡子把藍光反射進眼睛！眼睛收到光，就看到鏡子裡的自己囉！
      </p>
    </div>

  
    <!-- ===== 第二區：湖面倒影 ===== -->
    <style>@keyframes lkWobble{0%,100%{transform:translateX(-5px)}50%{transform:translateX(5px)}}</style>
    <section id="lake" class="flex flex-col gap-4 mt-8">
      <header class="bg-white border-4 border-sky-300 rounded-3xl p-4 shadow-md flex flex-col sm:flex-row items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-2xl bg-sky-400 flex items-center justify-center text-2xl shrink-0">🌳</div>
          <div>
            <h2 class="text-2xl sm:text-3xl font-black text-sky-950 tracking-wide">湖面看到倒影</h2>
            <p class="text-sm font-bold text-sky-700">平靜的水面，就像一面平放的鏡子！</p>
          </div>
        </div>
        <div class="flex flex-wrap gap-2 justify-center">
          <button id="lk-btn-sun" onclick="lkToggleSun()"></button>
          <button id="lk-btn-wind" onclick="lkToggleWind()"></button>
        </div>
      </header>

      <div class="bg-white border-4 border-sky-200 rounded-2xl p-2 shadow-sm flex flex-wrap items-center justify-center gap-2 sm:gap-3">
        <button class="lk-step" data-step="ALL" onclick="lkSetStep('ALL')">🌈 全部完整流程</button>
        <button class="lk-step" data-step="1" onclick="lkSetStep(1)">① 太陽照到樹 (黃光)</button>
        <button class="lk-step" data-step="2" onclick="lkSetStep(2)">② 樹彈光到湖面 (粉光)</button>
        <button class="lk-step" data-step="3" onclick="lkSetStep(3)">③ 湖面反射進眼睛 (藍光)</button>
        <button onclick="lkPlay()" class="btn-step px-4 py-2.5 rounded-xl bg-emerald-500 text-white font-black text-base shadow border-2 border-emerald-600 cursor-pointer">▶ 光的小旅行</button>
      </div>

      <div id="lk-stage" class="relative rounded-3xl border-4 border-sky-300 bg-sky-50 shadow-xl overflow-hidden transition-colors duration-500">
        <svg viewBox="0 0 1000 580" class="w-full h-auto select-none">
          <defs>
            <linearGradient id="lkWater" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#7dd3fc" /><stop offset="1" stop-color="#0369a1" />
            </linearGradient>
            <g id="lk-tree">
              <rect x="292" y="270" width="16" height="44" fill="#92400e" />
              <polygon points="300,150 235,275 365,275" fill="#15803d" />
              <polygon points="300,90 245,230 355,230" fill="#16a34a" />
            </g>
          </defs>

          <rect x="0" y="320" width="1000" height="260" fill="url(#lkWater)" />
          <g id="lk-waves" opacity="0" class="transition-opacity duration-500" fill="none" stroke="#fff" stroke-width="3">
            <path d="M 380 350 q 15 -9 30 0 t 30 0 t 30 0 t 30 0" /><path d="M 560 380 q 15 -9 30 0 t 30 0 t 30 0 t 30 0" />
            <path d="M 120 420 q 15 -9 30 0 t 30 0 t 30 0 t 30 0" /><path d="M 700 440 q 15 -9 30 0 t 30 0 t 30 0 t 30 0" />
            <path d="M 300 480 q 15 -9 30 0 t 30 0 t 30 0 t 30 0" /><path d="M 820 380 q 15 -9 30 0 t 30 0 t 30 0" />
          </g>
          <line x1="0" y1="320" x2="1000" y2="320" stroke="#0c4a6e" stroke-width="3" />

          <!-- 水中倒影（上下翻轉的樹） -->
          <g id="lk-image" class="transition-all duration-500"><g transform="translate(0,640) scale(1,-1)" opacity="0.55"><use href="#lk-tree" /></g></g>

          <rect x="225" y="310" width="150" height="14" rx="7" fill="#65a30d" />
          <rect x="650" y="310" width="150" height="14" rx="7" fill="#65a30d" />

          <g id="lk-sun" class="transition-opacity duration-300">

          </g>

          <path d="M 698 180 C 700 150, 752 150, 754 180 Z" fill="#eab308" />

      <div id="lk-card" class="border-4 rounded-3xl p-5 shadow-xl transition-all duration-300">
        <div class="bg-white/95 rounded-2xl p-2 mb-3 text-slate-800">

          <div class="flex items-center justify-center gap-1 sm:gap-3 text-sm sm:text-lg font-black">

            <span class="lk-node transition-all duration-300 bg-green-200 px-3 py-1.5 rounded-xl">🌳 樹</span><span>➔</span>
            <span class="lk-node transition-all duration-300 bg-sky-200 px-3 py-1.5 rounded-xl">🌊 湖面</span><span>➔</span>
            <span class="lk-node transition-all duration-300 bg-blue-200 px-3 py-1.5 rounded-xl">👁️ 眼睛</span>
          </div>
        </div>
        <div class="flex items-center gap-3 mb-2">
          <div id="lk-badge" class="w-10 h-10 rounded-2xl bg-white flex items-center justify-center text-xl font-black shadow-sm"></div>
          <h3 id="lk-title"></h3>
        </div>
        <p id="lk-body"></p>
      </div>
    </section>
  </div>

  <script>
    // 狀態設定
    let isLightOn = true;
    let currentStep = 'ALL'; // 'ALL', 1, 2, 3

    // 關鍵座標點 (X, Y)
    const LAMP = { x: 180, y: 70 };
    const EYE  = { x: 254, y: 148 };
    const HEAD = { x: 240, y: 110 };
    const FEET = { x: 255, y: 415 };
    const MIRROR_X = 500;

    // 計算入射反射點 Y 座標
    const HIT_HEAD_Y = (EYE.y + HEAD.y) / 2; // 頭頂光反射點 Y
    const HIT_FEET_Y = (EYE.y + FEET.y) / 2; // 腳尖光反射點 Y

    // 步驟設定資料庫
    const STEP_INFO = {
      'ALL': {
        title: '完整光線走法（三步驟一次看）',
        body: '① 燈泡黃光照到人 ➔ ② 人把粉光彈向鏡子 ➔ ③ 鏡子把藍光反射進眼睛！眼睛收到光，就看見鏡子裡的自己囉！',
        badge: '🌈'
      },
      1: {
        title: '步驟 ①：燈泡發光照射到身上',
        body: '燈泡發出黃色光線，直接照亮你的頭頂與腳尖。（太陽或房間電燈也是這樣喔！）',
        badge: '1'
      },
      2: {
        title: '步驟 ②：身體把光彈開（彈向鏡子）',
        body: '你自己不會發光！是衣服和皮膚把照到的光彈開，其中一部分射向鏡子。光被彈開，別人才看得到你。',
        badge: '2'
      },
      3: {
        title: '步驟 ③：鏡子把光反射進眼睛',
        body: '鏡子很平滑，把光整齊地反射進眼睛。眼睛以為光是從鏡子後面直直射來（紫色虛線），所以覺得鏡子裡有另一個你。其實那裡什麼都沒有！',
        badge: '3'
      }
    };

    // 切換步驟
    function setStep(step) {
      stopJourney();
      currentStep = step;
      updateStepButtons();
      updateScene();
    }

    // 更新步驟按鈕外觀
    function updateStepButtons() {
      const btnAll = document.getElementById('btn-step-all');
      const btn1 = document.getElementById('btn-step-1');
      const btn2 = document.getElementById('btn-step-2');
      const btn3 = document.getElementById('btn-step-3');

      // 重設所有按鈕為普通狀態
      [btnAll, btn1, btn2, btn3].forEach(btn => {
        btn.className = "btn-step px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-bold text-base hover:bg-slate-200 flex items-center gap-1.5 border-2 border-slate-200 cursor-pointer";
      });

      // 高亮當前選中的按鈕
      if (currentStep === 'ALL') {
        btnAll.className = "btn-step px-4 py-2.5 rounded-xl bg-amber-500 text-white font-black text-base shadow flex items-center gap-1.5 border-2 border-amber-600 cursor-pointer";
      } else if (currentStep === 1) {
        btn1.className = "btn-step px-4 py-2.5 rounded-xl bg-yellow-400 text-amber-950 font-black text-base shadow flex items-center gap-1.5 border-2 border-yellow-500 cursor-pointer";
      } else if (currentStep === 2) {
        btn2.className = "btn-step px-4 py-2.5 rounded-xl bg-pink-500 text-white font-black text-base shadow flex items-center gap-1.5 border-2 border-pink-600 cursor-pointer";
      } else if (currentStep === 3) {
        btn3.className = "btn-step px-4 py-2.5 rounded-xl bg-blue-600 text-white font-black text-base shadow flex items-center gap-1.5 border-2 border-blue-700 cursor-pointer";
      }
    }

    // 一鍵開關燈
    function toggleLight() {
      stopJourney();
      isLightOn = !isLightOn;
      updateScene();
    }

    // 重新繪製畫面與光線
    function updateScene() {
      const stageWrapper = document.getElementById('stage-wrapper');
      const bgGround = document.getElementById('bg-ground');
      const groupLamp = document.getElementById('group-lamp');
      const groupKidImage = document.getElementById('group-kid-image');
      const groupDarkText = document.getElementById('group-dark-text');
      const btnPower = document.getElementById('btn-power');
      const textPower = document.getElementById('text-power');
      const iconPower = document.getElementById('icon-power');
      const expTitle = document.getElementById('exp-title');
      const expBody = document.getElementById('exp-body');
      const expBadge = document.getElementById('exp-badge');
      const cardExp = document.getElementById('card-explanation');
      const raysLayer = document.getElementById('layer-rays');

      if (isLightOn) {
        // 開燈狀態
        stageWrapper.className = stageWrapper.className.replace('bg-slate-950', 'bg-sky-50');
        bgGround.setAttribute('fill', '#e2e8f0');
        groupLamp.style.opacity = '1';
        groupKidImage.style.opacity = '0.65';
        groupDarkText.style.opacity = '0';

        btnPower.className = "btn-step px-6 py-3 rounded-2xl bg-amber-400 hover:bg-amber-500 text-slate-900 font-black text-lg border-2 border-amber-500 shadow-md flex items-center gap-2 cursor-pointer shrink-0";
        textPower.innerText = "💡 燈開啟中 (點擊關燈)";
        iconPower.className = "fa-solid fa-lightbulb text-yellow-100 text-xl";

        cardExp.className = "bg-amber-400 border-4 border-amber-500 rounded-3xl p-5 shadow-xl transition-all duration-300";
        
        const info = STEP_INFO[currentStep];
        expTitle.innerText = info.title;
        expBody.innerText = info.body;
        expBadge.innerText = info.badge;

        renderLightRays();
        setFlow(currentStep);
      } else {
        // 關燈狀態：全暗，鏡中像徹底消失
        stageWrapper.className = stageWrapper.className.replace('bg-sky-50', 'bg-slate-950');
        bgGround.setAttribute('fill', '#0f172a');
        groupLamp.style.opacity = '0.15';
        groupKidImage.style.opacity = '0';
        groupDarkText.style.opacity = '1';

        btnPower.className = "btn-step px-6 py-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-yellow-300 font-black text-lg border-2 border-slate-600 shadow-md flex items-center gap-2 cursor-pointer shrink-0";
        textPower.innerText = "🌙 燈已關閉 (點擊開燈)";
        iconPower.className = "fa-solid fa-moon text-yellow-300 text-xl";

        cardExp.className = "bg-slate-800 border-4 border-slate-700 rounded-3xl p-5 shadow-xl transition-all duration-300";
        expTitle.innerText = "關燈實驗結果：";
        expBody.innerHTML = "<span class='text-amber-300 font-black'>關燈完全沒有光線 ➔ 沒有光能彈進眼睛 ➔ 鏡子裡的像完全消失不見囉！</span>";
        expBadge.innerText = "🙈";

        raysLayer.innerHTML = ''; // 清除所有光線
        setFlow(currentStep);
      }
    }

    // 繪製順向箭頭流動光束
    function renderLightRays() {
      const raysLayer = document.getElementById('layer-rays');
      raysLayer.innerHTML = '';

      // 步驟 ①：黃光（燈泡 ➔ 身體頭頂與腳尖）
      if (currentStep === 'ALL' || currentStep === 1) {
        drawRay(LAMP.x, LAMP.y, HEAD.x, HEAD.y, '#eab308', 'arrow-yellow');
        drawRay(LAMP.x, LAMP.y, FEET.x, FEET.y, '#eab308', 'arrow-yellow');
        drawBadge(200, 110, '① 發光', '#facc15', '#854d0e');
      }

      // 步驟 ②：粉光（身體頭頂與腳尖 ➔ 鏡子）
      if (currentStep === 'ALL' || currentStep === 2) {
        drawRay(HEAD.x, HEAD.y, MIRROR_X, HIT_HEAD_Y, '#ec4899', 'arrow-pink');
        drawRay(FEET.x, FEET.y, MIRROR_X, HIT_FEET_Y, '#ec4899', 'arrow-pink');
        drawBadge(360, 115, '② 彈光', '#f472b6', '#831843');
      }

      // 步驟 ③：藍光（鏡子 ➔ 眼睛）+ 鏡後紫虛線
      if (currentStep === 'ALL' || currentStep === 3) {
        drawRay(MIRROR_X, HIT_HEAD_Y, EYE.x, EYE.y, '#2563eb', 'arrow-blue');
        drawRay(MIRROR_X, HIT_FEET_Y, EYE.x, EYE.y, '#2563eb', 'arrow-blue');
        
        // 鏡後虛線 (延伸至虛像)
        drawDashedLine(MIRROR_X, HIT_HEAD_Y, 1000 - HEAD.x, HEAD.y, '#c084fc');
        drawDashedLine(MIRROR_X, HIT_FEET_Y, 1000 - FEET.x, FEET.y, '#c084fc');
        
        drawBadge(370, 175, '③ 反射進眼', '#3b82f6', '#1e3a8a');
        drawBadge(680, 62, '👀 眼睛以為光從這來', '#a855f7', '#ffffff', 170);
      }
    }

    // 繪製 SVG 流動線條
    function drawRay(x1, y1, x2, y2, color, arrowMarkerId) {
      const raysLayer = document.getElementById('layer-rays');
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", x1);
      line.setAttribute("y1", y1);
      line.setAttribute("x2", x2);
      line.setAttribute("y2", y2);
      line.setAttribute("stroke", color);
      line.setAttribute("stroke-width", "4.5");
      line.setAttribute("stroke-linecap", "round");
      line.setAttribute("class", "ray-animated");
      line.setAttribute("marker-end", `url(#${arrowMarkerId})`);
      raysLayer.appendChild(line);
    }

    // 繪製鏡後紫色虛線
    function drawDashedLine(x1, y1, x2, y2, color) {
      const raysLayer = document.getElementById('layer-rays');
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", x1);
      line.setAttribute("y1", y1);
      line.setAttribute("x2", x2);
      line.setAttribute("y2", y2);
      line.setAttribute("stroke", color);
      line.setAttribute("stroke-width", "3");
      line.setAttribute("stroke-dasharray", "6 6");
      line.setAttribute("opacity", "0.75");
      raysLayer.appendChild(line);
    }

    // 在畫面上繪製可愛步驟徽章
    function drawBadge(x, y, text, bgColor, textColor, w = 90) {
      const raysLayer = document.getElementById('layer-rays');
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      
      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("x", x);
      rect.setAttribute("y", y);
      rect.setAttribute("width", w);
      rect.setAttribute("height", "26");
      rect.setAttribute("rx", "13");
      rect.setAttribute("fill", bgColor);
      rect.setAttribute("stroke", "#ffffff");
      rect.setAttribute("stroke-width", "2");

      const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
      txt.setAttribute("x", x + w / 2);
      txt.setAttribute("y", y + 18);
      txt.setAttribute("text-anchor", "middle");
      txt.setAttribute("fill", textColor);
      txt.setAttribute("font-size", "13");
      txt.setAttribute("font-weight", "900");
      txt.textContent = text;

      g.appendChild(rect);
      g.appendChild(txt);
      raysLayer.appendChild(g);
    }

    const FLOW_ACTIVE = { 'ALL': [0,1,2,3], 1: [0,1], 2: [1,2], 3: [2,3] };
    function setFlow(step) {
      const on = isLightOn ? FLOW_ACTIVE[step] : [];
      document.querySelectorAll('.flow-node').forEach((n, i) => {
        n.style.opacity = on.includes(i) ? '1' : '0.3';
        n.style.transform = on.includes(i) ? 'scale(1.1)' : 'scale(1)';
      });
    }

    // 光的小旅行：一顆光點照順序走完 燈 ➔ 人 ➔ 鏡子 ➔ 眼睛
    let journeyRaf = null;
    function stopJourney() {
      if (journeyRaf) cancelAnimationFrame(journeyRaf);
      journeyRaf = null;
      document.getElementById('layer-dot').innerHTML = '';
    }
    function playJourney() {
      stopJourney();
      isLightOn = true;
      currentStep = 'ALL';
      updateStepButtons();
      updateScene();
      const hit = { x: MIRROR_X, y: HIT_HEAD_Y };
      const segs = [
        { a: LAMP, b: HEAD, color: '#eab308', step: 1 },
        { a: HEAD, b: hit, color: '#ec4899', step: 2 },
        { a: hit, b: EYE, color: '#2563eb', step: 3 }
      ];
      const NS = 'http://www.w3.org/2000/svg';
      const layer = document.getElementById('layer-dot');
      const glow = document.createElementNS(NS, 'circle');
      glow.setAttribute('r', '18'); glow.setAttribute('opacity', '0.35');
      const core = document.createElementNS(NS, 'circle');
      core.setAttribute('r', '9'); core.setAttribute('stroke', '#fff'); core.setAttribute('stroke-width', '3');
      layer.appendChild(glow); layer.appendChild(core);
      const dur = 1800, start = performance.now();
      let last = -1;
      function frame(now) {
        const t = now - start, idx = Math.floor(t / dur);
        if (idx >= segs.length) {
          setFlow('ALL');
          document.getElementById('exp-badge').innerText = '👁️';
          document.getElementById('exp-title').innerText = '光進到眼睛了！';
          document.getElementById('exp-body').innerText = '眼睛收到光，才看得到鏡子裡的自己。試試看：按「關燈」，就沒有光可以走，鏡子裡的你就消失了！';
          journeyRaf = null;
          return;
        }
        const sg = segs[idx], p = (t % dur) / dur;
        const x = sg.a.x + (sg.b.x - sg.a.x) * p, y = sg.a.y + (sg.b.y - sg.a.y) * p;
        [glow, core].forEach(c => { c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('fill', sg.color); });
        if (idx !== last) {
          last = idx;
          const info = STEP_INFO[sg.step];
          document.getElementById('exp-badge').innerText = info.badge;
          document.getElementById('exp-title').innerText = info.title;
          document.getElementById('exp-body').innerText = info.body;
          setFlow(sg.step);
        }
        journeyRaf = requestAnimationFrame(frame);
      }
      journeyRaf = requestAnimationFrame(frame);
    }

    // 頁面載入初始化
    window.onload = function() {
      updateStepButtons();
      updateScene();
    };
  </script>

  <script>
  (function () {
    const SUN = { x: 500, y: 50 }, E = { x: 708, y: 188 }, WY = 320;
    const PTS = [{ x: 300, y: 90 }, { x: 365, y: 275 }];   // 樹頂、樹下緣
    const hit = p => ({ x: E.x + (p.x - E.x) * (WY - E.y) / ((2 * WY - p.y) - E.y), y: WY });
    const img = p => ({ x: p.x, y: 2 * WY - p.y });
    const NS = 'http://www.w3.org/2000/svg', $ = id => document.getElementById(id);
    let sun = true, wind = false, step = 'ALL', raf = null;

    const INFO = {
      ALL: ['🌈', '完整光線走法（三步驟一次看）', '① 太陽光照到樹 ➔ ② 樹把光彈向湖面 ➔ ③ 平靜的湖面像鏡子，把光反射進眼睛！眼睛收到光，就看到水裡倒過來的樹囉！'],
      1: ['1', '步驟 ①：太陽光照到樹上', '太陽光照亮樹頂和樹的下半部。樹自己不會發光，是靠陽光才被看見。'],
      2: ['2', '步驟 ②：樹把光彈向湖面', '樹把光彈向四面八方，其中一部分往下射到湖面上。'],
      3: ['3', '步驟 ③：湖面把光反射進眼睛', '平靜的水面很平滑，像一面平放的鏡子，把光整齊地反射進眼睛。眼睛以為光是從水面下方直射來（紫色虛線），所以看到一棵倒過來的樹。樹頂的光走得最遠，所以倒影裡樹頂在最下面！']
    };
    const WIND = ['🌬️', '起風了：倒影變模糊', '水面不停晃動，不再平滑，光被反射到各個方向（粉色短線），只有很少的光剛好進到眼睛，倒影就變得模糊、破碎。'];
    const FLOW = { ALL: [0, 1, 2, 3], 1: [0, 1], 2: [1, 2], 3: [2, 3] };

    function mk(tag, a, parent) {
      const e = document.createElementNS(NS, tag);
      for (const k in a) e.setAttribute(k, a[k]);
      parent.appendChild(e); return e;
    }
    function ray(a, b, c, m) {
      mk('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: c, 'stroke-width': 4.5, 'stroke-linecap': 'round', class: 'ray-animated', 'marker-end': 'url(#' + m + ')' }, $('lk-rays'));
    }
    function dashed(a, b) {
      mk('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: '#c084fc', 'stroke-width': 3, 'stroke-dasharray': '6 6', opacity: 0.8 }, $('lk-rays'));
    }
    function badge(x, y, t, bg, tc, w = 90) {
      const g = mk('g', {}, $('lk-rays'));
      mk('rect', { x, y, width: w, height: 26, rx: 13, fill: bg, stroke: '#fff', 'stroke-width': 2 }, g);
      const tx = mk('text', { x: x + w / 2, y: y + 18, 'text-anchor': 'middle', fill: tc, 'font-size': 13, 'font-weight': 900 }, g);
      tx.textContent = t;
    }
    function scatter(h) {
      [[-70, -50], [-30, -65], [25, -65], [75, -35]].forEach(d =>
        mk('line', { x1: h.x, y1: h.y, x2: h.x + d[0], y2: h.y + d[1], stroke: '#ec4899', 'stroke-width': 3, 'stroke-linecap': 'round', opacity: 0.7 }, $('lk-rays')));
    }
    function setText(info) {
      const dark = !sun;
      $('lk-badge').textContent = info[0];
      $('lk-title').textContent = info[1];
      $('lk-body').textContent = info[2];
      $('lk-title').className = 'text-xl sm:text-2xl font-black ' + (dark ? 'text-white' : 'text-sky-950');
      $('lk-body').className = 'text-lg sm:text-xl font-black leading-relaxed ' + (dark ? 'text-amber-300' : 'text-slate-900');
    }
    function setFlow(k) {
      const on = sun ? FLOW[k] : [];
      document.querySelectorAll('.lk-node').forEach((n, i) => {
        n.style.opacity = on.includes(i) ? '1' : '0.3';
        n.style.transform = on.includes(i) ? 'scale(1.1)' : 'scale(1)';
      });
    }
    function render() {
      const st = $('lk-stage'), im = $('lk-image');
      st.className = st.className.replace(sun ? 'bg-slate-950' : 'bg-sky-50', sun ? 'bg-sky-50' : 'bg-slate-950');
      $('lk-sun').style.opacity = sun ? 1 : 0.15;
      im.style.opacity = sun ? 1 : 0;
      im.style.filter = wind ? 'blur(4px)' : 'none';
      im.style.animation = wind ? 'lkWobble 1s ease-in-out infinite' : 'none';
      $('lk-dark').style.opacity = sun ? 0 : 1;
      $('lk-waves').style.opacity = wind ? 1 : 0;
      $('lk-wlabel').textContent = wind ? '🌬️ 起風，水面晃動' : '🌊 靜止的湖面';

      const base = 'btn-step px-5 py-3 rounded-2xl font-black text-base border-2 shadow-md cursor-pointer ';
      $('lk-btn-sun').className = base + (sun ? 'bg-amber-400 hover:bg-amber-500 text-slate-900 border-amber-500' : 'bg-slate-800 text-yellow-300 border-slate-600');
      $('lk-btn-sun').textContent = sun ? '☀️ 太陽出來了 (點擊關閉)' : '🌙 太陽下山了 (點擊開啟)';
      $('lk-btn-wind').className = base + (wind ? 'bg-teal-500 text-white border-teal-600' : 'bg-white text-teal-800 border-teal-300');
      $('lk-btn-wind').textContent = wind ? '🌬️ 水面：起風 (點擊變平靜)' : '🍃 水面：靜止 (點擊起風)';
      document.querySelectorAll('.lk-step').forEach(b => {
        const on = String(step) === b.dataset.step;
        b.className = 'lk-step btn-step px-4 py-2.5 rounded-xl font-black text-base border-2 cursor-pointer ' + (on ? 'bg-sky-600 text-white border-sky-700 shadow' : 'bg-slate-100 text-slate-700 border-slate-200 hover:bg-sky-100');
      });
      $('lk-card').className = 'border-4 rounded-3xl p-5 shadow-xl transition-all duration-300 ' + (sun ? 'bg-sky-300 border-sky-500' : 'bg-slate-800 border-slate-700');

      $('lk-rays').innerHTML = '';
      setFlow(step);
      if (!sun) { setText(['🙈', '太陽下山實驗結果：', '沒有光線 ➔ 沒有光進到眼睛 ➔ 水裡的倒影完全消失不見囉！']); return; }
      setText(wind && (step === 'ALL' || step === 3) ? WIND : INFO[step]);

      if (step === 'ALL' || step === 1) {
        PTS.forEach(p => ray(SUN, p, '#eab308', 'arrow-yellow'));
        badge(430, 100, '① 發光', '#facc15', '#854d0e');
      }
      if (step === 'ALL' || step === 2) {
        PTS.forEach(p => { const h = hit(p); ray(p, h, '#ec4899', 'arrow-pink'); if (wind) scatter(h); });
        badge(470, 205, '② 彈光', '#f472b6', '#831843');
      }
      if (step === 'ALL' || step === 3) {
        PTS.forEach(p => { const h = hit(p); ray(h, E, '#2563eb', 'arrow-blue'); dashed(h, img(p)); });
        badge(520, 240, '③ 反射進眼', '#3b82f6', '#1e3a8a');
        badge(430, 480, '👀 眼睛以為光從水裡來', '#a855f7', '#ffffff', 200);
      }
    }
    function stop() { if (raf) cancelAnimationFrame(raf); raf = null; $('lk-dot').innerHTML = ''; }

    window.lkToggleSun = () => { stop(); sun = !sun; render(); };
    window.lkToggleWind = () => { stop(); wind = !wind; render(); };
    window.lkSetStep = k => { stop(); step = k; render(); };
    window.lkPlay = () => {
      stop(); sun = true; step = 'ALL'; render();
      const h = hit(PTS[0]);
      const segs = [[SUN, PTS[0], '#eab308', 1], [PTS[0], h, '#ec4899', 2], [h, E, '#2563eb', 3]];
      const layer = $('lk-dot');
      const glow = mk('circle', { r: 18, opacity: 0.35 }, layer);
      const core = mk('circle', { r: 9, stroke: '#fff', 'stroke-width': 3 }, layer);
      const dur = 1800, t0 = performance.now(); let last = -1;
      (function frame(now) {
        const t = now - t0, i = Math.floor(t / dur);
        if (i >= segs.length) {
          setFlow('ALL');
          setText(['👁️', '光進到眼睛了！', '眼睛收到光，才看得到水裡的倒影。試試看：按「太陽下山」倒影會消失；再按「起風」，看倒影怎麼變模糊！']);
          raf = null; return;
        }
        const [a, b, c, k] = segs[i], p = (t % dur) / dur;
        [glow, core].forEach(e => { e.setAttribute('cx', a.x + (b.x - a.x) * p); e.setAttribute('cy', a.y + (b.y - a.y) * p); e.setAttribute('fill', c); });
        if (i !== last) { last = i; setText(INFO[k]); setFlow(k); }
        raf = requestAnimationFrame(frame);
      })(t0);
    };
    render();
  })();
  </script>
</body>
